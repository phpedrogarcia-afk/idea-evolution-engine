[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-evolution-engine"
version = "0.1.0"
description = "Idea Evolution Engine — FioIdeias V1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
]

[project.scripts]
iee = "src.idea_evolution.cli.main:main"
