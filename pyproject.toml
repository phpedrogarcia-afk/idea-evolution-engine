[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-evolution-engine"
version = "1.0.0"
description = "FioIdeias V1 — Lean L1 Default"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "requests",
]

[project.scripts]
iee = "src.idea_evolution.cli.main:main"
