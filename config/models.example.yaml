schema_version: "1.0.0"
description: "Exemplo canônico de roteamento multi-modelo sob política FREE_ONLY para o Idea Evolution Engine"
cost_policy: FREE_ONLY
execution_mode: EXPERIMENTAL_PINNED

models:
  analyst:
    provider: groq
    model: openai/gpt-oss-120b
    credential_env: GROQ_API_KEY
    parameters:
      temperature: 0.2

  critic:
    provider: groq
    model: qwen/qwen3.6-27b
    credential_env: GROQ_API_KEY
    parameters:
      temperature: 0.3

  reality_checker:
    provider: gemini
    model: gemini-3.7-flash
    credential_env: GEMINI_API_KEY
    parameters:
      temperature: 0.1

  synthesizer:
    provider: groq
    model: openai/gpt-oss-120b
    credential_env: GROQ_API_KEY
    parameters:
      temperature: 0.2

routes:
  understand: analyst
  attack: critic
  critique_1: critic
  revision_1: analyst
  critique_2: critic
  revision_2: analyst
  alternatives: analyst
  reality_check: reality_checker
  synthesize: synthesizer
  final_review: critic

default_model_alias: analyst
